<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LASER ESCAPE — render preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; touch-action: none; }
      #nav { position: fixed; top: 6px; left: 6px; right: 6px; font: 600 11px/1.2 system-ui, sans-serif; pointer-events: none; }
      #nav div { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 3px; }
      #nav a { pointer-events: auto; color: #fff; text-decoration: none; background: rgba(0,0,0,0.45); padding: 3px 6px; border-radius: 6px; }
      #nav a.on { background: #ff3358; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="nav"></div>
    <script type="module" src="/src/render/preview.ts"></script>
  </body>
</html>
